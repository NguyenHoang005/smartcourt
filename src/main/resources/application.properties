spring.application.name=smartcourt

# Đọc trực tiếp file .env ở thư mục gốc (tính năng có sẵn của Spring Boot, không cần thư viện ngoài)
spring.config.import=optional:file:.env[.properties]

# ===== MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartcourt?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
